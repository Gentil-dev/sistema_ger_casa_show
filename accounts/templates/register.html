{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white text-center">
                    <h4>Registre-se!</h4>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-success">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label for="{{ user_form.user_form.email.id_for_label }}" class="font-weight-bold">E-mail:</label>
                            {{ user_form.email }}
                            <div class="text-danger">
                                {{ user_form.email.errors }}
                            </div>
                        </div>

                        <div class="form-group text-center">
                            <input type="submit" class="btn btn-success btn-block" value="Cadastrar">
                        </div>
                    </form>

                    <p class="text-center mt-3">Já tem uma conta? <a href="{% url 'login' %}">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
