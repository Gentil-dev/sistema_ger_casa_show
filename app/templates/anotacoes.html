{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h2 class="text-center">Anotações</h2>
  <div class="d-flex justify-content-center">
    <div class="editor-wrapper" style="width: 100%;">
      <div class="toolbar" id="toolbar1"></div>
      <div class="editor" id="editor1" style="height: 600px; border: 2px solid #ccc;"></div>
      <div class="d-flex justify-content-between mt-2">
        <button class="btn btn-danger px-1 py-2" onclick="removerSelecao()">Remover seleção</button>
        <button class="btn btn-primary px-6 py-2" onclick="salvarAnotacoes()">Salvar</button>
      </div>
  </div>
  <div class="text-center mt-3">
  </div>
</div>

<script>
  let editor;

  document.addEventListener('DOMContentLoaded', function () {
    editor = new Quill('#editor1', {
      theme: 'snow',
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline', 'strike'],
          ['link', 'image'],
          [{ 'size': ['small', false, 'large', 'huge'] }],
          [{ 'color': [] }, { 'background': [] }],
          [{ 'align': [] }],
          ['clean']
        ]
      }
    });

    fetch('/api/anotacoes/')
      .then(response => response.json())
      .then(data => {
        if (data.editor1) editor.root.innerHTML = data.editor1;
      });
  });

  function salvarAnotacoes() {
    const html = editor.root.innerHTML;

    fetch('/api/anotacoes/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({ editor1: html })
    })
    .then(response => response.json())
    .then(data => {
      if (data.message) {
        alert(data.message);
      } else if (data.error) {
        alert("Erro: " + data.error);
      }
    })
    .catch(() => alert('Erro ao salvar anotações.'));
  }

  function removerSelecao() {
    const selection = editor.getSelection();
    if (selection && selection.length > 0) {
      editor.deleteText(selection.index, selection.length);
    } else {
      alert("Selecione um trecho para remover.");
    }
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>
{% endblock %}
